buffs = true

# Voulez-vous synchroniser les données des bâtiments ?
buildings = true

# Do you want to sync Haven data?
haven = true

# Voulez-vous synchroniser les données d'inventaire ?
inventory = true

# Voulez-vous synchroniser les données de tâches ?
jobs = true

# Voulez-vous synchroniser les données des missions ?
missions = true

# Do you want to sync owned officer data?
officers = true

# Sync your own player profile (level, XP, power, Haven unlocked), never other players. Requires mod 1.1.10 or newer.
profile = false

# Voulez-vous synchroniser les données de recherche ?
research = true

# Voulez-vous synchroniser les données de ressources ?
resources = true

# Voulez-vous synchroniser les données des vaisseaux possédés ?
ships = true

# Voulez-vous synchroniser les données d'emplacements ?
slots = true

# Sync faction store offer data. Requires mod 1.1.10 or newer.
store_offers = false

# Voulez-vous synchroniser les données de technologie interdite possédée ?
tech = true

# Voulez-vous synchroniser les données de traits ?
traits = true

# Subgroup: Diagnostics
# ---------------------

# Voulez-vous activer le débogage de synchronisation ? (Nécessite les journaux de synchronisation)
debug = false

# Voulez-vous activer les journaux de synchronisation ?
logging = false

# Subgroup: Host
# --------------

# L'url du serveur à travers lequel faire passer la connexion
proxy = ""

# Subgroup: Network
# -----------------

# Durée de conservation des éléments en cache (ms)
resolver_cache_ttl = 300

# Les certificats SSL doivent-ils être vérifiés ?
verify_ssl = true

