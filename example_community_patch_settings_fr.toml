[control]
# Protect and recover Kir’Shara queues after target or address changes.
kirshara_fixes = true

# Only allow the primary action when the selected target is visible in the current view.
primary_requires_visible_target = false

# Intervalle de double-pression en ms pour sélectionner/localiser les vaisseaux 1 à 8. Plus bas = plus rapide, plus haut = plus lent. Par défaut : 500.
select_timer = 500

# Subgroup: Hotkeys
# -----------------

# Si vous ne voulez pas de raccourcis vous pouvez mettre ça sur désactiver (désactive les raccourcis du mod et de Scopely)
hotkeys_enabled = true

# Si vous préférez désactiver les raccourcis étendu mettez ça sur désactiver
hotkeys_extended = true

# Si vous avez l’artefact Kir’Shara, la file d’attente doit-elle être activée par défaut ?
queue_enabled = true

# Si vous préférez utiliser les raccourcis de Scopely mettez ça sur activer
use_scopely_hotkeys = false

# Subgroup: Options
# -----------------

# Activer les paramètres expérimentaux
enable_experimental = false

