[graphics]

# Subgroup: Display
# -----------------

# Frame-rate scaling factor
fr_scale = 2.0

# Tiempo entre transiciones; aumenta el valor para ralentizarlas
transition_time = 0.01

# Especifica cuánto se escala la interfaz; el valor predeterminado es 1,0
ui_scale = 0.6

# Especifica la escala de los modelos de barcos en la vista del sistema; el valor predeterminado es 1,0
ui_scale_ship = 1.0

# This specifies the amount to adjust the scale by, 0.05 being default
ui_scale_step = 0.05

# Especifica la escala de los visores de objetos de la interfaz; el valor predeterminado es 1,0
ui_scale_viewer = 1.2

# Subgroup: Fleet Labels
# ----------------------

# Label detail shown for non-player and unknown fleets in System View
#   "native" - Use Scopely's Near/Middle/Far behaviour
#   "expanded" - Always show long fleet labels
#   "compact" - Always show compact fleet labels
#   "threshold" - Switch from expanded to compact at the configured zoom threshold
zoom_label_non_player_detail = "native"

# Normalized zoom crossover used when non-player fleet label detail is "threshold"; 0 is always compact and 1 is always expanded
zoom_label_non_player_threshold = 0.5

# Label detail shown for player fleets in System View
#   "native" - Use Scopely's Near/Middle/Far behaviour
#   "expanded" - Always show long fleet labels
#   "compact" - Always show compact fleet labels
#   "threshold" - Switch from expanded to compact at the configured zoom threshold
zoom_label_player_detail = "native"

# Normalized zoom crossover used when player fleet label detail is "threshold"; 0 is always compact and 1 is always expanded
zoom_label_player_threshold = 0.5

# Subgroup: Keyboard
# ------------------

# Controla la velocidad de zoom al usar Q/E en la vista del sistema; el valor predeterminado es 350
keyboard_zoom_speed = 350.0

# Controla la velocidad de inercia del desplazamiento del sistema. El valor predeterminado es 0,4
system_pan_momentum = 0.4

# Controla la rapidez con la que disminuye la inercia al soltar el ratón. Menor = parada más rápida. El valor predeterminado es 0,8
system_pan_momentum_falloff = 0.8

# Subgroup: Loader
# ----------------

# Establece el valor en verdadero para usar loader_image en la pantalla de carga
loader_enabled = true

# Ruta de la imagen personalizada de la pantalla de carga (déjala en blanco para usar la imagen integrada)
loader_image = ""

# Multiplier applied to the logo size on the loading screen
loader_logo_scale = 1.0

# Show the custom tip on the loading screen
loader_tip_enabled = true

# Establece el valor en verdadero para usar la imagen de carga en la pantalla de transición
loader_transition = true

# Use a black background instead of the custom image during transitions
loader_transition_black = false

# Subgroup: Options
# -----------------

# ¿Permitir que se sustituya el cursor del sistema? (Activado de forma predeterminada)
allow_cursor = true

# Permite el modo de pantalla completa sin bordes; establece el valor en falso para desactivarlo
borderless_fullscreen = true

# Keep the system camera free when selecting a target. Requires mod 1.1.10 or newer.
disable_target_camera_lock = false

# Permite cambiar el tamaño libremente; establece el valor en falso para desactivarlo
free_resize = true

# Show the remaining Galactic Anomaly time below Help All, Engage, and Claim
galactic_anomaly_timer = false

# Después de usar un preajuste de zoom, este se establecerá como zoom predeterminado
use_presets_as_default = true

# Subgroup: Zoom
# --------------

# Establece 0,0 para desactivar el zoom personalizado; de lo contrario, entra al sistema con el zoom indicado
default_system_zoom = 1750.0

# Maximum zoom-out distance in Haven; 0 preserves native behavior.
haven_zoom = 4000.0

# Station-interior zoom-out multiplier; 1 preserves native behavior. Default 2.
interior_zoom_scale = 2.0

# Preajuste de zoom F1 para la vista del sistema
system_zoom_preset_1 = 50.0

# Preajuste de zoom F2 para la vista del sistema
system_zoom_preset_2 = 500.0

# Preajuste de zoom F3 para la vista del sistema
system_zoom_preset_3 = 1250.0

# Preajuste de zoom F4 para la vista del sistema
system_zoom_preset_4 = 2750.0

# Preajuste de zoom F5 para la vista del sistema
system_zoom_preset_5 = 5000.0

# Controla la distancia máxima de zoom en la vista del sistema. El valor predeterminado es 2500. Los valores más altos aumentan la distancia de las etiquetas
zoom = 5000.0

