# Si prefieres desactivar los atajos ampliados, establece este valor en falso
hotkeys_extended = true

# Si tienes el artefacto Kir'Shara, ¿debe activarse la cola de forma predeterminada?
queue_enabled = true

# Si prefieres usar los atajos de Scopely, establece este valor en verdadero
use_scopely_hotkeys = false

# Subgroup: Options
# -----------------

# Activar funciones experimentales
enable_experimental = false

