[control]
# Protect and recover Kir’Shara queues after target or address changes.
kirshara_fixes = true

# Only allow the primary action when the selected target is visible in the current view.
primary_requires_visible_target = false

# Intervalo de doble pulsación en ms para seleccionar/localizar los barcos 1-8. Menor = más rápido, mayor = más lento. Predeterminado: 500
select_timer = 500

# Subgroup: Hotkeys
# -----------------

# Si no quieres usar atajos, establece este valor en falso (desactiva tanto los atajos del mod como los de Scopely)
