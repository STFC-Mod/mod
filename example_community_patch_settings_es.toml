[sync]

# Subgroup: Data
# --------------

# Do you want to sync away team assignment data?
away_assignments = true

# ¿Quieres sincronizar los registros de batalla?
battlelogs = false

# ¿Quieres sincronizar los datos de mejoras?
buffs = true

# ¿Quieres sincronizar los datos de edificios?
buildings = true

# Do you want to sync Haven data?
haven = true

# ¿Quieres sincronizar los datos del inventario?
inventory = true

# ¿Quieres sincronizar los datos de trabajos?
jobs = true

# ¿Quieres sincronizar los datos de misiones?
missions = true

# Do you want to sync owned officer data?
officers = true

# Sync your own player profile (level, XP, power, Haven unlocked), never other players. Requires mod 1.1.10 or newer.
profile = false

# ¿Quieres sincronizar los datos de investigación?
research = true

# ¿Quieres sincronizar los datos de recursos?
resources = true

# ¿Quieres sincronizar los datos de los barcos que posees?
ships = true

# ¿Quieres sincronizar los datos de ranuras?
slots = true

# Sync faction store offer data. Requires mod 1.1.10 or newer.
store_offers = false

# ¿Quieres sincronizar los datos de tecnología prohibida que posees?
tech = true

# ¿Quieres sincronizar los datos de rasgos?
traits = true

# Subgroup: Diagnostics
# ---------------------

# ¿Quieres activar la depuración de sincronización? (Requiere el registro de sincronización)
debug = false

# ¿Quieres activar el registro de sincronización?
logging = false

# Subgroup: Host
# --------------

# La URL del servidor a través del cual se canalizará la conexión
proxy = ""

# Subgroup: Network
# -----------------

# Cuánto tiempo se conservan los elementos en caché (ms)
resolver_cache_ttl = 300

# ¿Deben comprobarse los certificados SSL?
verify_ssl = true

