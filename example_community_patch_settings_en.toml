[control]
# Protect and recover Kir’Shara queues after target or address changes.
kirshara_fixes = true

# Only allow the primary action when the selected target is visible in the current view.
primary_requires_visible_target = false

# Double-tap window in ms for 1-8 ship select/locate. Lower = faster, higher = slower. Default 500
select_timer = 500

# Subgroup: Hotkeys
# -----------------

# If you don't want any hotkeys you can set this to false (disables both mod and scopely hotkeys)
hotkeys_enabled = true

# If you prefer to disable the extended hotkeys set this to false
hotkeys_extended = true

# If you have the Kir'Shara artifact, should the queue be enabled by default?
queue_enabled = true

# If you prefer to use Scopely's hotkeys set this to true
use_scopely_hotkeys = false

# Subgroup: Options
# -----------------

# Enable experimental features
enable_experimental = false

