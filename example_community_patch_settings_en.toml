# Do you want to sync live fleet state (mining, docked, warping...)? Opt-in, off by default
fleets = false

# Do you want to sync inventory data?
inventory = true

# Do you want to sync jobs data?
jobs = true

# Do you want to sync mission data?
missions = true

# Do you want to sync owned officer data?
officers = true

# Do you want to sync your own player profile (level, XP, Power, Haven unlocked)?
# Only your own record is sent, never other players'.
profile = false

# Do you want to sync research data?
research = true

# Do you want to sync resource data?
resources = true

# Do you want to sync owned ship data?
ships = true

# Do you want to sync slots data?
slots = true

# Do you want to sync faction store offer data?
store_offers = false

# Do you want to sync owned forbidden tech data?
tech = true

# Do you want to sync trait data?
traits = true

# Subgroup: Diagnostics
# ---------------------

# Do you want to enable sync debug? (Requires sync logging)
debug = false

# Do you want to enable sync logging?
logging = false

# Subgroup: Host
# --------------

# The url of the server to proxy the connection through
proxy = ""

# Subgroup: Network
# -----------------

# How long to keep cached items (ms)
resolver_cache_ttl = 300

# Should SSL Certificates be checked?
verify_ssl = true

