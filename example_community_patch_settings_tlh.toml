haven = true

# Do you want Daq  sync inventory De'?
inventory = true

# Do you want Daq  sync jobs De'?
jobs = true

# Do you want Daq  sync mission De'?
missions = true

# Do you want to sync owned officer data?
officers = true

# Sync your own player profile (level, XP, power, Haven unlocked), never other players. Requires mod 1.1.10 or newer.
profile = false

# Do you want Daq  sync research De'?
research = true

# Do you want Daq  sync resource De'?
resources = true

# Do you want Daq  sync owned Duj De'?
ships = true

# Do you want Daq  sync slots De'?
