# Sync faction store offer data. Requires mod 1.1.10 or newer.
store_offers = false

# Do you want Daq  sync owned forbidden tech De'?
tech = true

# Do you want Daq  sync trait De'?
traits = true

# Subgroup: Diagnostics
# ---------------------

# Do you want Daq  chu'moH sync debug? (poQ sync logging)
debug = false

# Do you want Daq  chu'moH sync logging?
logging = false

# Subgroup: Host
# --------------

#  URL of  De'wI' Daq  proxy  connection through
proxy = ""

# Subgroup: Network
# -----------------

# How long Daq  keep cached items (ms)
resolver_cache_ttl = 300

# tlhIngan Hol: Should SSL Certificates be checked?
verify_ssl = true

