[control]
# Protect and recover Kir’Shara queues after target or address changes.
kirshara_fixes = true

# Only allow the primary action when the selected target is visible in the current view.
primary_requires_visible_target = false

# Zeitfenster für Doppeltippen in ms, um die Schiffe 1–8 auszuwählen/zu orten. Niedriger = schneller, höher = langsamer. Standardwert: 500
select_timer = 500

# Subgroup: Tastenkürzel
# ----------------------

# Auf false setzen, wenn keine Hotkeys verwendet werden sollen (deaktiviert sowohl Mod- als auch Scopely-Hotkeys)
hotkeys_enabled = true

# Auf false setzen, um die erweiterten Hotkeys zu deaktivieren
hotkeys_extended = true

# Soll die Warteschlange standardmäßig aktiviert sein, wenn das Kir'Shara-Artefakt vorhanden ist?
queue_enabled = true

# Auf true setzen, um die Hotkeys von Scopely zu verwenden
use_scopely_hotkeys = false

# Subgroup: Optionen
# ------------------

# Experimentelle Funktionen aktivieren
enable_experimental = false

