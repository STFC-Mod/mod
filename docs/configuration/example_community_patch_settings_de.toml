[sync]

# Subgroup: Daten
# ---------------

# Do you want to sync away team assignment data?
away_assignments = true

# Kampfberichte synchronisieren?
battlelogs = false

# Buff-Daten synchronisieren?
buffs = true

# Gebäudedaten synchronisieren?
buildings = true

# Do you want to sync Haven data?
haven = true

# Inventardaten synchronisieren?
inventory = true

# Auftragsdaten synchronisieren?
jobs = true

# Missionsdaten synchronisieren?
missions = true

# Do you want to sync owned officer data?
officers = true

# Sync your own player profile (level, XP, power, Haven unlocked), never other players. Requires mod 1.1.10 or newer.
profile = false

# Forschungsdaten synchronisieren?
research = true

# Ressourcendaten synchronisieren?
resources = true

# Daten eigener Schiffe synchronisieren?
ships = true

# Slot-Daten synchronisieren?
slots = true

# Sync faction store offer data. Requires mod 1.1.10 or newer.
store_offers = false

# Daten eigener verbotener Technologien synchronisieren?
tech = true

# Eigenschaftsdaten synchronisieren?
traits = true

# Subgroup: Diagnose
# ------------------

# Synchronisierungs-Debugging aktivieren? (Erfordert Synchronisierungsprotokollierung)
debug = false

# Synchronisierungsprotokollierung aktivieren?
logging = false

# Subgroup: Host
# --------------

# URL des Servers, über den die Verbindung weitergeleitet wird
proxy = ""

# Subgroup: Netzwerk
# ------------------

# Speicherdauer zwischengespeicherter Einträge (ms)
resolver_cache_ttl = 300

# Sollen SSL-Zertifikate überprüft werden?
verify_ssl = true

