[ui]
# Überspringt die Animation und öffnet die Boxen direkt
always_skip_reveal_sequence = true
auto_confirm_discovery = true

# Open the bulk gift claim flyout automatically
auto_open_bulk_claim_flyout = false

# Verhindert, dass die Escape-Taste zum Beenden des Spiels auffordert
disable_escape_exit = true

# Maximum gap in milliseconds between Escape presses that opens the exit prompt; 0 disables double-tap exit
disable_escape_exit_timer = 0

# ⚠️ EXPERIMENTELL: Verhindert das Erscheinen des ersten Werbe-Pop-ups
disable_first_popup = false

# ⚠️ EXPERIMENTELL: Verhindert die Funktion der standardmäßigen Bewegungstasten
disable_move_keys = false

# ⚠️ EXPERIMENTELL: Verhindert die Funktion der standardmäßigen Toast-Banner
disable_toast_banners = false

# Show only the first popup advert and suppress subsequent popup adverts.
only_show_first_popup = false

# Show the newest Haven help-history entries first.
reverse_haven_history = true

# Subgroup: Auto Confirm
# ----------------------

# Automatically confirm the max-level warning when contributing to an alliance that has reached level 60. Requires mod 1.1.10 or newer.
auto_confirm_alliance_contribution = false

# Stufen- und Rangverbesserungen für Verbotene Technologie automatisch bestätigen
auto_confirm_ft_upgrade = false

# Sofort-Warp-Aktion, die automatisch bestätigt wird: none, warp oder jump
#   "none" - Do not choose an action automatically; show the confirmation dialog
#   "warp" - Automatically choose regular warp
#   "jump" - Automatically choose instant jump
auto_confirm_instant_warp = "none"

# Skip the Excelsior Decloaking Deflector confirmation popup.
auto_confirm_reveal_ability = false

# Comma-separated ship hull names for which the instant-warp popup is always shown, overriding all automatic actions
instant_warp_always_ask = ""

# Comma-separated ship hull names to always instant jump; use "*" for all ships or leave blank for none
instant_warp_auto_jump = ""

# Comma-separated ship hull names to always regular warp; use "*" for all ships or leave blank for none
instant_warp_auto_warp = ""

# Subgroup: Banner
# ----------------

# Gibt die Bannertypen an, die nicht angezeigt werden sollen (durch Kommas getrennt)
disabled_banner_types = ""

# Specifies banner types that should trigger notifications (comma separated)
notify_banner_types = ""

# Subgroup: Chat
# --------------

# Open alliance side chat once per login, after station and chat initialization, section completion, and three continuous seconds of readiness. Requires mod 1.1.10 or newer.
auto_open_chat = false

# Initial side-chat width in canvas units; 0 preserves the native width. Positive values are clamped to available space and the minimum width. Requires mod 1.1.10 or newer.
default_chat_width = 0

# Auf true setzen, um den Galaxie-Chat aus dem Spiel zu entfernen
disable_galaxy_chat = false

# Auf true setzen, um den Schleier-Chat aus dem Spiel zu entfernen
disable_veil_chat = false

# Show player title rows in chat messages.
show_player_title = true

# Subgroup: Chest Purchases
# -------------------------

# Maximum for tagged chest-purchase sliders on Windows; 0 disables the feature and native limits above this value are preserved
extend_chest_purchase_max = 160

# Subgroup: Tägliche Ziele
# ------------------------

# Kommagetrennte Fraktionen (federation, klingon, romulan), für die der Sammelbelohnungs-Schalter der täglichen Ziele gilt; leer lassen, um das Standardverhalten des Spiels beizubehalten
daily_bulk_claim_factions = "federation,klingon,romulan"

# Den Schalter Alle beanspruchen der täglichen Ziele beim ersten Öffnen des Bildschirms pro Sitzung wieder aktivieren
daily_bulk_claim_toggle_default_on = false

# Subgroup: Spenden
# -----------------

# Erweitert den Spendenschieberegler auf den Maximalwert der nächsten Allianzstufe
extend_donation_max = 80

# Erweiterung des Spendenschiebereglers aktivieren
extend_donation_slider = true

# Subgroup: Flottenmanagement
# ---------------------------

# Mit der linken und rechten Pfeiltaste das vorherige oder nächste Schiff im Flottenmanagement-Dock auswählen
arrow_keys_to_select_ship = true

# Keep the dock selection in sync with Manage Ships.
dock_syncmanagement = true

# Ein Schiff im Flottenmanagement-Dock doppelklicken, um es direkt zuzuweisen, statt es auszuwählen und anschließend auf Zuweisen zu klicken
double_click_to_assign_ship = false

# Kommagetrennte Schiffsnamen, die im Flottenmanagement-Dock immer zuerst angezeigt werden; angeheftete Schiffe behalten die aktive Sortierreihenfolge bei
pinned_ships = ""

# Subgroup: HUD
# -------------

# HUD visibility mode: auto, show, or hide
#   "auto" - Use the game's default visibility behaviour
#   "show" - Always show this HUD item
#   "hide" - Always hide this HUD item
hud_field_training = "auto"

# HUD visibility mode: auto, show, or hide
#   "auto" - Use the game's default visibility behaviour
#   "show" - Always show this HUD item
#   "hide" - Always hide this HUD item
hud_missions = "auto"

# HUD visibility mode: auto, show, or hide
#   "auto" - Use the game's default visibility behaviour
#   "show" - Always show this HUD item
#   "hide" - Always hide this HUD item
hud_outposts = "auto"

# HUD visibility mode: auto, show, or hide
#   "auto" - Use the game's default visibility behaviour
#   "show" - Always show this HUD item
#   "hide" - Always hide this HUD item
hud_q_trials = "auto"

# Subgroup: Options
# -----------------

# Hide the Exchange All button in the Artifact Gallery
disable_exchange_all = false

# Enable the shortcut that focuses the search box on supported screens
focus_search = true

# Show the equipped ship name in Forbidden Tech details. Requires mod 1.1.10 or newer.
forbidden_tech_ship_name = true

# Format abbreviated cargo values using Cargo Significant Decimals
format_cargo_values = true

# Restore the Below Deck Ability officer sort option
officer_sort = true

# Subgroup: Vorschauen
# --------------------

# Decimal places used for abbreviated cargo values
cargo_significant_decimals = 2

# Verhindert das Orten, während Schiffs- oder Knotenvorschauen angezeigt werden
disable_preview_locate = false

# Verhindert den Rückruf, während Schiffs- oder Knotenvorschauen angezeigt werden
disable_preview_recall = false

# Show cargo used and capacity immediately instead of counting up. Restart after changing. Windows client 263 only; other builds keep native behavior
instant_cargo_counter = true

# Auf true setzen, um die Belohnungen für ausgewählte Schiffe/Stationen immer anzuzeigen
show_armada_cargo = true

# Auf true setzen, um die Belohnungen für ausgewählte Schiffe/Stationen immer anzuzeigen
show_cargo_default = true

# Auf true setzen, um die Belohnungen für ausgewählte Schiffe/Stationen immer anzuzeigen
show_hostile_cargo = true

# Auf true setzen, um die Belohnungen für ausgewählte Schiffe/Stationen immer anzuzeigen
show_player_cargo = true

# Auf true setzen, um die Belohnungen für ausgewählte Schiffe/Stationen immer anzuzeigen
show_station_cargo = true

