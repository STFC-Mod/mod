loadingscreenhooks = true
loadingtiphooks = true
miscpatches = true
missionhudtweakshooks = true
objecttracker = true
officersorthooks = true
panhooks = true

# SHIFT+click a fleet dock ship tile to pin or unpin it; updates pinned ships.
