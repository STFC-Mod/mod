# Optional notification sound; none disables the alert. Requires Toast Banner Hooks.
alert_armada_created = "none"

# Optional notification sound; none disables the alert. Requires Toast Banner Hooks.
alert_defeat = "none"

# Optional notification sound; none disables the alert. Requires Toast Banner Hooks.
alert_victory = "none"

# Comma-separated audio event names to suppress; leave blank to allow all audio events
disabled_events = ""

# Write audio event names to the trace log for troubleshooting
