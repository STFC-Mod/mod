[control]
# Protect and recover Kir’Shara queues after target or address changes.
kirshara_fixes = true

# Only allow the primary action when the selected target is visible in the current view.
primary_requires_visible_target = false

# Tidsrum i ms for dobbelttryk ved valg/lokalisering af skib 1-8. Lavere = hurtigere, højere = langsommere. Standard er 500
select_timer = 500

# Subgroup: Hotkeys
# -----------------

# Hvis du ikke vil bruge genvejstaster, kan du sætte denne til falsk (deaktiverer både mod- og Scopely-genvejstaster)
hotkeys_enabled = true

# Sæt denne til falsk, hvis du vil deaktivere de udvidede genvejstaster
hotkeys_extended = true

# Skal køen være aktiveret som standard, hvis du har Kir'Shara-artefakten?
queue_enabled = true

# Sæt denne til sand, hvis du foretrækker at bruge Scopelys genvejstaster
use_scopely_hotkeys = false

# Subgroup: Options
# -----------------

# Aktivér eksperimentelle funktioner
enable_experimental = false

