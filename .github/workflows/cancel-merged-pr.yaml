name: Cancel merged PR runs

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      # Only trusted inline code runs here; never check out the PR with this token.
      - name: Cancel unfinished PR workflows
        uses: actions/github-script@v9
        with:
          script: |
            const number = context.payload.pull_request.number;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo,
              event: 'pull_request',
              created: `>=${context.payload.pull_request.created_at}`,
              per_page: 100,
            });
            for (const run of runs) {
              if (run.status === 'completed' ||
                  !run.pull_requests.some(pr => pr.number === number)) {
                continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun({
                  ...context.repo,
                  run_id: run.id,
                });
                core.info(`Requested cancellation of ${run.name} (${run.id}) for PR #${number}`);
              } catch (error) {
                // A run can finish between listing it and requesting cancellation.
                if (error.status !== 409) throw error;
                core.info(`Run ${run.id} is no longer cancellable`);
              }
            }
