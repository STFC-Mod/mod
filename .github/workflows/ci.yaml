name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build-win:
    runs-on: windows-2025-vs2026
    outputs:
      run_attempt: ${{ steps.build_identity.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Stamp commit hash
        run: python scripts/stamp-version-hash.py "${{ github.sha }}"
      - name: Provision pinned sysroot when configured
        shell: pwsh
        env:
          STFC_WINDOWS_TOOLCHAIN_URL: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL }}
        run: |
          if ($env:STFC_WINDOWS_TOOLCHAIN_URL) { zig build fetch-toolchains }
      - name: Build and test
        id: build_identity
        shell: pwsh
        run: |
          "run_attempt=${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
          zig build install test-toolchains test-codegen test-deps test-il2cpp test-mod test-spud `
            -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dtest-optimize=Debug `
            "-Dstfc_source_state_id=git:${{ github.sha }}" `
            "-Dstfc_base_commit=${{ github.sha }}" `
            "-Dstfc_build_invocation_id=github:${{ github.run_id }}:${{ github.run_attempt }}:windows" `
            -Dstfc_build_channel=ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify proxy binary contract
        run: python scripts/verify-windows-binary.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: stfc-community-mod
          path: zig-out/bin/version.dll
          if-no-files-found: error

  cross-win:
    # Enable this by configuring a hosted sysroot URL; no temporary URL is committed.
    if: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fetch and cross-compile
        env:
          STFC_WINDOWS_TOOLCHAIN_URL: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL }}
        run: |
          zig build fetch-toolchains
          zig build install build-tests -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dtest-optimize=Debug
          python3 scripts/verify-windows-binary.py

  build-mac:
    name: build-mac (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-macos.14.6
            runner: macos-26
            artifact: macos-arm64-build
          - arch: x86_64
            target: x86_64-macos.14.6
            runner: macos-26-intel
            artifact: macos-x86_64-build
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Stamp commit hash
        run: python3 scripts/stamp-version-hash.py "${{ github.sha }}"
      - name: Build and test
        run: |
          zig build install launcher test-toolchains test-codegen test-deps test-il2cpp test-mod test-spud \
            -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dtest-optimize=Debug --summary all
      - name: Verify portable linkage
        run: |
          for binary in zig-out/macOSLauncher.app/Contents/MacOS/macOSLauncher zig-out/bin/stfc-community-mod-loader zig-out/lib/libstfc-community-mod.dylib; do
            otool -L "$binary"
            if otool -L "$binary" | grep -vE '^[[:space:]]+/usr/lib/libcurl(\.[0-9]+)*\.dylib[[:space:]]' | grep -E '/opt/homebrew/|/usr/local/(opt|Cellar)/|(^|/)lib(ssl|crypto|curl)(\.[0-9]+)*\.dylib'; then
              echo "::error::Forbidden dynamic dependency in $binary"
              exit 1
            fi
          done
      - name: Package intermediate build
        run: |
          mkdir -p .artifacts/mac
          cp zig-out/macOSLauncher.app/Contents/MacOS/macOSLauncher .artifacts/mac/
          cp zig-out/bin/stfc-community-mod-loader zig-out/lib/libstfc-community-mod.dylib .artifacts/mac/
          if [[ '${{ matrix.arch }}' == 'arm64' ]]; then
            cp -R zig-out/macOSLauncher.app .artifacts/mac/
          fi
          tar -cf macos-${{ matrix.arch }}-build.tar -C .artifacts/mac .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: macos-${{ matrix.arch }}-build.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  attest-win:
    name: attest-win
    needs: build-win
    if: >-
      github.event_name == 'push' &&
      github.repository == 'STFC-Mod/mod' &&
      github.ref_protected &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: windows-2025-vs2026
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download Windows DLL
        uses: actions/download-artifact@v8.0.1
        with:
          name: stfc-community-mod
          path: .artifacts/windows

      - name: Verify DLL provenance
        shell: pwsh
        env:
          STFC_SOURCE_COMMIT: ${{ github.sha }}
          STFC_RUN_ID: ${{ github.run_id }}
          STFC_BUILD_RUN_ATTEMPT: ${{ needs.build-win.outputs.run_attempt }}
        run: |
          $dll = (Resolve-Path -LiteralPath '.artifacts/windows/version.dll').Path
          $commit = $env:STFC_SOURCE_COMMIT
          $runId = $env:STFC_RUN_ID
          $buildAttempt = $env:STFC_BUILD_RUN_ATTEMPT

          if ($commit -notmatch '^[0-9a-f]{40}$') {
            throw "Unable to resolve the workflow commit for DLL provenance."
          }
          if ($runId -notmatch '^[1-9][0-9]*$') {
            throw "Unable to resolve the workflow run ID for DLL provenance."
          }
          if ($buildAttempt -notmatch '^[1-9][0-9]*$') {
            throw "The producing build did not provide a valid run attempt."
          }

          $expected = "stfc-identity-v1;distribution=netniv.stfc-community-mod;source=git:$commit;" +
            "base=$commit;build=github:${runId}:${buildAttempt}:windows;mode=release;channel=ci"
          $comments = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll).Comments
          if (-not [string]::Equals($comments, $expected, [System.StringComparison]::Ordinal)) {
            throw "DLL provenance mismatch. Expected '$expected'; found '$comments'."
          }
          Write-Host "Verified DLL provenance: $comments"

      - name: Attest Windows DLL
        uses: actions/attest@v4.2.1
        with:
          subject-path: .artifacts/windows/version.dll


  package-mac:
    name: package-mac
    needs: build-mac
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          show-progress: false

      - name: Download ARM64 build
        uses: actions/download-artifact@v8.0.1
        with:
          name: macos-arm64-build
          path: .artifacts/arm64

      - name: Download x86_64 build
        uses: actions/download-artifact@v8.0.1
        with:
          name: macos-x86_64-build
          path: .artifacts/x86_64

      - name: Restore architecture builds
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p zig-out/staging/arm64
          mkdir -p zig-out/staging/x86_64

          tar -xf .artifacts/arm64/macos-arm64-build.tar \
            -C zig-out/staging/arm64

          tar -xf .artifacts/x86_64/macos-x86_64-build.tar \
            -C zig-out/staging/x86_64

          test -f zig-out/staging/arm64/macOSLauncher
          test -f zig-out/staging/x86_64/macOSLauncher

          test -f zig-out/staging/arm64/stfc-community-mod-loader
          test -f zig-out/staging/x86_64/stfc-community-mod-loader

          test -f zig-out/staging/arm64/libstfc-community-mod.dylib
          test -f zig-out/staging/x86_64/libstfc-community-mod.dylib

          test -f \
            zig-out/staging/arm64/macOSLauncher.app/Contents/Resources/Assets.car

          test -f \
            zig-out/staging/arm64/macOSLauncher.app/Contents/Info.plist

      - name: Create universal App Bundle
        shell: bash
        run: |
          set -euo pipefail

          APP="zig-out/staging/arm64/macOSLauncher.app"

          lipo -create \
            zig-out/staging/arm64/macOSLauncher \
            zig-out/staging/x86_64/macOSLauncher \
            -output "$APP/Contents/MacOS/macOSLauncher"

          lipo -create \
            zig-out/staging/arm64/stfc-community-mod-loader \
            zig-out/staging/x86_64/stfc-community-mod-loader \
            -output "$APP/Contents/stfc-community-mod-loader"

          lipo -create \
            zig-out/staging/arm64/libstfc-community-mod.dylib \
            zig-out/staging/x86_64/libstfc-community-mod.dylib \
            -output "$APP/Contents/libstfc-community-mod.dylib"

          cp assets/launcher.icns \
            "$APP/Contents/Resources/"

          mv \
            zig-out/staging/arm64/macOSLauncher.app \
            "zig-out/staging/arm64/STFC Community Mod.app"

          FINAL_APP="zig-out/staging/arm64/STFC Community Mod.app"

          test -f "$FINAL_APP/Contents/Info.plist"
          test -f "$FINAL_APP/Contents/Resources/Assets.car"
          test -f "$FINAL_APP/Contents/Resources/launcher.icns"
          test -f "$FINAL_APP/Contents/MacOS/macOSLauncher"
          test -f "$FINAL_APP/Contents/stfc-community-mod-loader"
          test -f "$FINAL_APP/Contents/libstfc-community-mod.dylib"

      - name: Verify universal binaries
        shell: bash
        run: |
          set -euo pipefail

          APP="zig-out/staging/arm64/STFC Community Mod.app"

          verify_universal() {
            local file="$1"
            local archs

            archs="$(lipo -archs "$file")"
            echo "$file: $archs"

            [[ " $archs " == *" arm64 "* ]]
            [[ " $archs " == *" x86_64 "* ]]
          }

          verify_universal \
            "$APP/Contents/MacOS/macOSLauncher"

          verify_universal \
            "$APP/Contents/stfc-community-mod-loader"

          verify_universal \
            "$APP/Contents/libstfc-community-mod.dylib"

      - name: Verify universal app linkage
        shell: bash
        run: |
          set -euo pipefail

          APP="zig-out/staging/arm64/STFC Community Mod.app"

          check_linkage() {
            local binary="$1"
            local deps

            echo
            echo "==> $binary"
            deps="$(otool -L "$binary")"
            printf '%s\n' "$deps"

            if printf '%s\n' "$deps" \
              | grep -vE '^[[:space:]]+/usr/lib/libcurl(\.[0-9]+)*\.dylib[[:space:]]' \
              | grep -E \
              '/opt/homebrew/|/usr/local/(opt|Cellar)/|(^|/)libssl(\.[0-9]+)*\.dylib|(^|/)libcrypto(\.[0-9]+)*\.dylib|(^|/)libcurl(\.[0-9]+)*\.dylib'
            then
              echo "::error file=$binary::Forbidden dynamic dependency detected"
              return 1
            fi
          }

          check_linkage "$APP/Contents/MacOS/macOSLauncher"
          check_linkage "$APP/Contents/stfc-community-mod-loader"
          check_linkage "$APP/Contents/libstfc-community-mod.dylib"

      - name: Sign App Bundle
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --force \
            --verify \
            --verbose \
            --deep \
            --sign "-" \
            "zig-out/staging/arm64/STFC Community Mod.app"

      - name: Install packaging tools
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail

          # zstd is currently preinstalled on the macOS 26 image.
          # Keep the fallback so the workflow remains robust if the
          # runner image changes later.
          command -v zstd >/dev/null 2>&1 || brew install zstd
          command -v create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Package macOS mod archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stfc-community-mod-macos-universal

          tar -cf - \
            -C "zig-out/staging/arm64/STFC Community Mod.app/Contents" \
            libstfc-community-mod.dylib \
            | zstd -15 -T0 \
              -o stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst

          shasum -a 256 \
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst \
            | awk '{print $1}' \
            > stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256

      - name: Create installer
        shell: bash
        run: |
          set -euo pipefail

          APP="zig-out/staging/arm64/STFC Community Mod.app"
          DMG_SOURCE="zig-out/staging/arm64/dmg-source"

          mkdir -p "$DMG_SOURCE"
          mv "$APP" "$DMG_SOURCE/"

          create_dmg_options=(
            --filesystem APFS
            --format ULFO
            --volname "STFC Community Mod Installer"
            --volicon assets/launcher.icns
            --no-internet-enable
            --background assets/mac_installer_background.png
            --window-pos 200 120
            --window-size 800 400
            --icon-size 100
            --icon "STFC Community Mod.app" 200 190
            --app-drop-link 600 185
            --applescript-sleep-duration 1
          )

          create-dmg "${create_dmg_options[@]}" \
            stfc-community-mod-installer.dmg \
            "$DMG_SOURCE/"

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stfc-community-mod-installer
          path: stfc-community-mod-installer.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload macOS mod archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stfc-community-mod-macos-universal
          path: stfc-community-mod-macos-universal
          compression-level: 0
          if-no-files-found: error
