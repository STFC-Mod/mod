# Default bindings before the action registry rewrite.

[always]
move_up = "W | UP"
move_down = "S | DOWN"
move_left = "A | LEFT"
move_right = "D | RIGHT"
set_hotkeys_disabled = "CTRL-ALT-MINUS"
set_hotkeys_enabled = "CTRL-ALT-="
select_chatalliance = "CTRL-2"
select_chatglobal = "CTRL-1"
select_chatprivate = "CTRL-3"
quit = "F10"
select_ship1 = "1"
select_ship2 = "2"
select_ship3 = "3"
select_ship4 = "4"
select_ship5 = "5"
select_ship6 = "6"
select_ship7 = "7"
select_ship8 = "8"
select_current = "CTRL-SPACE"
focus_search = "CTRL-F"
action_primary = "SPACE | MOUSE1"
action_secondary = "TAB | MOUSE4"
action_queue = "SPACE | MOUSE1"
action_queue_clear = "CTRL-C"
action_view = "V | MOUSE2"
action_recall = "R | MOUSE3"
action_recall_cancel = "SPACE | MOUSE1"
action_repair = "R | MOUSE3"
show_chat = "C"
show_chatside1 = "ALT-C"
show_chatside2 = "`"
show_galaxy = "G"
show_galaxy_native = "CTRL-G"
show_system = "H"
zoom_preset1 = "F1"
zoom_preset2 = "F2"
zoom_preset3 = "F3"
zoom_preset4 = "F4"
zoom_preset5 = "F5"
zoom_in = "Q"
zoom_out = "E"
zoom_max = "MINUS"
zoom_min = "BACKSPACE"
zoom_reset = "="
ui_scaleup = "PGUP"
ui_scaledown = "PGDOWN"
ui_scaleshipup = "CTRL-PGUP"
ui_scaleshipdown = "CTRL-PGDOWN"
ui_scaleviewerup = "SHIFT-PGUP"
ui_scaleviewerdown = "SHIFT-PGDOWN"
log_debug = "CTRL-SHIFT-F9"
log_trace = "CTRL-SHIFT-F7"
log_info = "CTRL-SHIFT-F8"
log_warn = "CTRL-SHIFT-F10"
log_error = "CTRL-SHIFT-F11"
log_off = "CTRL-SHIFT-F12"
restart = "F9"
reload_settings = "CTRL-SHIFT-F6"
show_awayteam = "T"
show_gifts = "/"
show_artifacts = "SHIFT-I"
show_commander = "O"
show_daily = "Z"
show_events = "SHIFT-E"
show_events_native = "CTRL-E"
show_exocomp = "X"
show_factions = "F"
show_inventory = "I"
show_missions = "M"
show_research = "U"
show_scrapyard = "Y"
show_settings = "SHIFT-S"
toggle_shortcut_hints = "HOME"
show_officers = "SHIFT-O"
show_officerpresets = "CTRL-O"
show_officerswap = "ALT-O"
show_qtrials = "SHIFT-Q"
show_refinery = "SHIFT-F"
show_ships = "N"
show_shipconstruction = "SHIFT-N"
show_shipswap = "ALT-N"
show_shields = "CTRL-S"
show_battlelogs = "SHIFT-B"
show_stationexterior = "SHIFT-G"
show_stationinterior = "SHIFT-H"
show_haven = "ALT-H"
toggle_queue = "CTRL-Q"
toggle_instant_warp = "ALT-I"

[extended]
show_alliance = "ALT-'"
show_bookmarks = "B"
set_zoom_preset1 = "SHIFT-F1"
set_zoom_preset2 = "SHIFT-F2"
set_zoom_preset3 = "SHIFT-F3"
set_zoom_preset4 = "SHIFT-F4"
set_zoom_preset5 = "SHIFT-F5"
set_zoom_default = "CTRL-="
toggle_preview_locate = "CTRL-R"
toggle_preview_recall = "CTRL-T"
toggle_cargo_default = "ALT-1"
toggle_cargo_player = "ALT-2"
toggle_cargo_station = "ALT-3"
toggle_cargo_hostile = "ALT-4"
toggle_cargo_armada = "ALT-5"

[experimental]
show_alliance_help = "SHIFT-'"
show_alliance_armada = "CTRL-'"
show_lookup = "L"
