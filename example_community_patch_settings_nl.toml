[control]
# Protect and recover Kir’Shara queues after target or address changes.
kirshara_fixes = true

# Only allow the primary action when the selected target is visible in the current view.
primary_requires_visible_target = false

# Tijdsvenster in ms dubbel in te drukken van nr 1-8 schip selecteren/lokaliseren. Lager = sneller, hoger = trager. Standaardwaarde is 500
select_timer = 500

# Subgroup: Hotkeys
# -----------------

# Als je geen toetsenbord sneltoetsen wilt zet dit uit (Zet zowel mod & Scopely sneltoetsen uit)
hotkeys_enabled = true

# Als je geen uitgebreide lijst aan sneltoetsen wilt zet dit uit
hotkeys_extended = true

# Als je de Kir'Shara artefect hebt, moet de wachtrij standaard ingeschakeld zijn?
queue_enabled = true

# Als je de Scopely sneltoetsen prefereerd over die van de mod, schakel dit dan aan
use_scopely_hotkeys = false

# Subgroup: Options
# -----------------

# Schakel experimentele functies in
enable_experimental = false

