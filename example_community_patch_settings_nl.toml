[sync]

# Subgroup: Data
# --------------

# Do you want to sync away team assignment data?
away_assignments = true

# Wil je Gevechtslogboeken syncen?
battlelogs = false

# Wil je data van buffs syncen?
buffs = true

# Wil je data van gebouwen syncen?
buildings = true

# Do you want to sync Haven data?
haven = true

# Wil je data van je inventaris syncen?
inventory = true

# Wil je data van je banen syncen?
jobs = true

# Wil je data van missies syncen?
missions = true

# Do you want to sync owned officer data?
officers = true

# Sync your own player profile (level, XP, power, Haven unlocked), never other players. Requires mod 1.1.10 or newer.
profile = false

# Wil je data van onderzoeken syncen?
research = true

# Wil je data van grondstoffen syncen?
resources = true

# Wil je data van schepen die je in bezit hebt syncen?
ships = true

# Wil je de data van je slots syncen?
slots = true

# Sync faction store offer data. Requires mod 1.1.10 or newer.
store_offers = false

# Wil je data van de verboden technologie die je in bezit hebt syncen?
tech = true

# Wil je data van de karaktereigenschappen van de officieren die je in bezit hebt syncen?
traits = true

# Subgroup: Diagnostics
# ---------------------

# Wil je sync debug inschakelen? (Logboek moet ingeschakeld zijn!)
debug = false

# Wil je het logboek inschakelen voor de sync functionaliteit?
logging = false

# Subgroup: Host
# --------------

# De url van de proxyserver die je wilt gebruiken om de verbinding door te sturen
proxy = ""

# Subgroup: Network
# -----------------

# Hoelang je items gecaches wilt hebben (ms)
resolver_cache_ttl = 300

# Zouden SSL certificaten geverifieerd moeten worden?
verify_ssl = true

